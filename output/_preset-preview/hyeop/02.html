<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../templates/presets/hyeop.css">
<style>
.card { display:flex; flex-direction:column; justify-content:center; gap:44px; }
h2 { font-size: 64px; font-weight: 800; line-height:1.3; }
.flow { display:flex; flex-direction:column; gap:8px; font-size:44px; font-weight:700; line-height:1.7; }
.flow span { color:#bbb; font-weight:400; font-size:34px; margin-right:16px; }
</style>
</head>
<body>
  <div class="card">

    <h2>우리는 이 길을<br>이미 걸어왔다</h2>
    <hr class="divider">
    <div class="flow">
      <div><span>01</span>허니버터칩</div>
      <div><span>02</span>탕후루</div>
      <div><span>03</span>두바이 쫀득쿠키</div>
      <div><span>04</span><mark>버터떡 ← 지금 여기</mark></div>
    </div>
    <div class="page-num">02 / 07</div>
  </div>
</body>
</html>
