<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../templates/presets/paperlogy.css">
<style>
.card { display:flex; flex-direction:column; justify-content:center; gap:36px; }
h2 { font-size: 56px; font-weight: 800; line-height:1.3; }
.imgwrap { background:#fff; border-radius:24px; padding:32px; box-shadow:0 4px 18px rgba(0,0,0,0.06); }
.imgwrap img { display:block; width:100%; max-height:760px; object-fit:contain; border-radius:14px; }
.cap { font-size: 34px; text-align:center; }
</style>
</head>
<body>
  <div class="card">

    <h2>"또 신상 디저트에<br>줄을 서라고?"</h2>
    <div class="imgwrap"><img src="../assets/grumpy-cat.jpg" alt=""></div>
    <p class="cap sub">유행이 피로해진 소비자의 표정 (이미지 카드는 이렇게)</p>
    <div class="page-num">04 / 07</div>
  </div>
</body>
</html>
