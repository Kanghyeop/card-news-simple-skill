<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../templates/presets/paperlogy.css">
<style>
.card { display:flex; flex-direction:column; justify-content:center; gap:40px; }
h2 { font-size: 64px; font-weight: 800; line-height:1.3; }
.panel p { font-size: 40px; line-height: 1.55; }
.panel p + p { margin-top: 22px; }
</style>
</head>
<body>
  <div class="card">

    <h2>다음 주자의 조건</h2>
    <div class="panel">
      <p>한 입 컷이 나오는 <b class="accent">비주얼</b></p>
      <p>아무 데서나 못 사는 <b>희소성</b></p>
      <p>"이게 무슨 맛이지?"라는 <b>호기심</b></p>
    </div>
    <p class="sub" style="font-size:36px;">세 가지를 다 갖춘 후보가 나타나는 순간, 줄은 다시 생긴다.</p>
    <div class="page-num">05 / 07</div>
  </div>
</body>
</html>
