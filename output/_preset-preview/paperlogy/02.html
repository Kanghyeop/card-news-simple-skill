<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../templates/presets/paperlogy.css">
<style>
.card { display:flex; flex-direction:column; justify-content:center; gap:40px; }
h2 { font-size: 64px; font-weight: 800; line-height:1.3; }
.flow { display:flex; flex-direction:column; gap:20px; }
.flow .panel { padding: 30px 40px; font-size: 40px; font-weight:700; }
.flow .panel span { color:#8e8e93; font-weight:500; font-size:32px; margin-right:18px; }
</style>
</head>
<body>
  <div class="card">

    <h2>우리는 이 길을<br>이미 걸어왔다</h2>
    <div class="flow">
      <div class="panel"><span>01</span>허니버터칩</div>
      <div class="panel"><span>02</span>탕후루</div>
      <div class="panel"><span>03</span>두바이 쫀득쿠키</div>
      <div class="panel"><span>04</span><b class="accent">버터떡 ← 지금 여기</b></div>
    </div>
    <div class="page-num">02 / 07</div>
  </div>
</body>
</html>
