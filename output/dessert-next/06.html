<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../templates/base.css">
<style>
.card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 64px;
}
h2 {
  font-size: 76px;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -0.02em;
}
.sub {
  font-size: 34px;
  color: #bbbbbb;
  line-height: 1.7;
}
.cta {
  margin-top: 24px;
  font-size: 30px;
  font-weight: 600;
  color: #888888;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>
  <div class="card">
    <h2>유행은 우연이 아니라<br>공식이다</h2>
    <div class="sub">식감, 조합, 찍을 거리.<br>세 가지가 모이는 곳에 다음 대란이 온다.</div>
    <hr class="divider">
    <div class="cta">다음 유행, 먼저 알고 싶다면 팔로우</div>
  </div>
</body>
</html>
