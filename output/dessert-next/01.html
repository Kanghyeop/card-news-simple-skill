<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../templates/base.css">
<style>
.card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.words {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 72px;
}
.word {
  font-size: 88px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.word.dim1 { color: #555555; }
.word.dim2 { color: #999999; }
h1 {
  font-size: 100px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin-bottom: 64px;
}
.hook {
  font-size: 34px;
  font-weight: 400;
  color: #bbbbbb;
  line-height: 1.6;
}
</style>
</head>
<body>
  <div class="card">
    <div class="words">
      <div class="word dim1">탕후루,</div>
      <div class="word dim2">두쫀쿠,</div>
      <div class="word">버터떡.</div>
    </div>
    <h1>그 다음은<br>무엇인가</h1>
    <div class="hook">유행 디저트에는 공식이 있다. 끝까지 보면 다음 주인공이 보인다 →</div>
  </div>
</body>
</html>
