<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../templates/base.css">
<style>
.card {
  display: flex;
  flex-direction: column;
  padding-top: 140px;
  gap: 48px;
}
.label {
  font-size: 30px;
  font-weight: 600;
  color: #888888;
  letter-spacing: 0.15em;
}
h2 {
  font-size: 72px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.02em;
}
p {
  font-size: 36px;
  font-weight: 400;
  line-height: 1.75;
  color: #dddddd;
}
.formula {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.row {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 40px;
  font-weight: 700;
}
.plus {
  font-size: 36px;
  font-weight: 400;
  color: #777777;
  width: 36px;
  text-align: center;
}
.tag {
  font-size: 26px;
  font-weight: 400;
  color: #999999;
}
</style>
</head>
<body>
  <div class="card">
    <div class="label">공식 ②</div>
    <h2>익숙한 것에<br>낯선 것 한 스푼</h2>
    <p>완전히 새로운 음식은 오히려 외면받는다. 히트작은 늘 아는 맛 위에 모르는 조합을 얹었다.</p>
    <div class="formula">
      <div class="row"><span class="plus"></span>떡 + 버터 <span class="tag">= 버터떡</span></div>
      <div class="row"><span class="plus"></span>쿠키 + 카다이프 <span class="tag">= 두쫀쿠</span></div>
      <div class="row"><span class="plus"></span>초콜릿 + 피스타치오 <span class="tag">= 두바이 초콜릿</span></div>
    </div>
    <div class="page-num">04 / 06</div>
  </div>
</body>
</html>
